services:
  qingliao:
    build:
      context: .
      # v4.0.13：版本信息构建期注入（update.sh 会自动传入；手动 build 时留空不影响运行，
      # /api/version 会回退读 VERSION 文件或 .git，都读不到则 version=""）
      args:
        QL_BACKEND_VERSION: ${QL_BACKEND_VERSION:-}
        QL_BACKEND_COMMIT: ${QL_BACKEND_COMMIT:-}
        QL_BACKEND_BUILT: ${QL_BACKEND_BUILT:-}
    container_name: qingliao
    restart: unless-stopped
    ports:
      - "9125-9150:9125-9150"
    environment:
      # 必填：统一访问密码（所有 API 的密码鉴权）
      # BE4：默认值 "changeme" 与代码里的 "change-me" 都是公开常量，去掉——
      # 留空时 auth_api 自动生成随机密码写入 /data/initial_password.txt
      QL_PASSWORD: ${QL_PASSWORD:-}

      # === 服务间 token（BE3：刻意不给默认值；留空 = 对应接口拒绝放行）===
      # Hermes 插件 / cron 必须使用与此处相同的值
      QL_INBOX_TOKEN: ${QL_INBOX_TOKEN:-}
      QL_PUSH_TOKEN: ${QL_PUSH_TOKEN:-}
      
      # === 数据目录 ===
      QL_DATA_DIR: ${QL_DATA_DIR:-/data}

      # v4.0.14：宿主 git 仓根（install.sh 自动写入 .env）；selfupdate 一键更新用
      QL_REPO_DIR: ${QL_REPO_DIR:-}
      QL_UPLOAD_DIR: ${QL_UPLOAD_DIR:-/data/uploads}
      QL_HERMES_DATA_DIR: ${QL_HERMES_DATA_DIR:-/data/hermes}
      QL_HERMES_HOST_DIR: ${QL_HERMES_HOST_DIR:-/data/hermes_host}
      QL_HERMES_ROOT_DIR: ${QL_HERMES_ROOT_DIR:-/data/hermes}
      
      # === 目录路径 ===
      QL_ASR_DIR: ${QL_ASR_DIR:-/data/asr_tmp}
      QL_ASR_DIR_HOST: ${QL_ASR_DIR_HOST:-/data/asr_tmp}
      QL_KB_DIR: ${QL_KB_DIR:-/data/kb}
      QL_LOGS_DIR: ${QL_LOGS_DIR:-/data/logs}
      QL_MEMORY_PATH: ${QL_MEMORY_PATH:-/data/memory.json}
      QL_SECRETS_STORE: ${QL_SECRETS_STORE:-/data/secrets_store.json.enc}
      QL_SECRETS_KEY: ${QL_SECRETS_KEY:-/data/.secrets_key}
      
      # === 配置文件 ===
      QL_CONFIG_YAML: ${QL_CONFIG_YAML:-/data/profiles/wechat-profile/config.yaml}
      QL_CONFIG_YAML_FALLBACK: ${QL_CONFIG_YAML_FALLBACK:-/data/profiles/wechat-profile/config.yaml}
      
      # === 工具路径 ===
      QL_WHISPER_PYTHON: ${QL_WHISPER_PYTHON:-/usr/local/bin/python3}
      QL_ASR_SERVER: ${QL_ASR_SERVER:-/app/asr_server.py}
      
      # === 容器配置 ===
      QL_HERMES_CONTAINER: ${QL_HERMES_CONTAINER:-hermes-container}
      QL_LOG_CONTAINER: ${QL_LOG_CONTAINER:-hermes}
      
      # === 网络配置 ===
      STREAM_WEBHOOK_URL: ${STREAM_WEBHOOK_URL:-http://localhost:8644/webhooks/qingliao-push}
      QL_OLLAMA_URL: ${QL_OLLAMA_URL:-http://localhost:11434/v1}
      
      # === 上游 LLM ===
      QL_HERMES_URL: ${QL_HERMES_URL:-http://host.docker.internal:9123/v1/chat/completions}
      QL_HERMES_KEY: ${QL_HERMES_KEY:-}
      # === Hermes 上游主链路（stream_api/cron/goal 共用；容器内 127.0.0.1 会打到自己，
      # 必须显式注入；App 设置页（/api/hermes/upstream）可再覆盖，无需重启）===
      STREAM_HERMES_URL: ${STREAM_HERMES_URL:-http://host.docker.internal:9123/v1/chat/completions}
      STREAM_HERMES_SESSION: ${STREAM_HERMES_SESSION:-1}
      
      # === Home Assistant ===
      QL_HA_URL: ${QL_HA_URL:-http://host.docker.internal:8123}
      QL_HA_TOKEN: ${QL_HA_TOKEN:-}
      
      # === 路由器 ===
      QL_ROUTER_HOST: ${QL_ROUTER_HOST:-}
      QL_ROUTER_USER: ${QL_ROUTER_USER:-root}
      QL_ROUTER_PASSWORD: ${QL_ROUTER_PASSWORD:-}
      
      # === Docker 管理 ===
      QL_DOCKER_ROOT: ${QL_DOCKER_ROOT:-/data/docker}
      
      # === Agent 模式 ===
      QL_AGENT_URL: ${QL_AGENT_URL:-https://api.deepseek.com/v1/chat/completions}
      QL_AGENT_KEY: ${QL_AGENT_KEY:-}
      QL_AGENT_MODEL: ${QL_AGENT_MODEL:-deepseek-chat}
      
      # === 数据目录 ===
      STREAM_DATA_DIR: ${STREAM_DATA_DIR:-/data/streams_data}
      SESSIONS_DATA_DIR: ${SESSIONS_DATA_DIR:-/data/sessions}

      # === 连接器 OAuth（云服务点按授权用；商业版内置，自托管按 README「连接器 OAuth 配置」填） ===
      QL_OAUTH_REDIRECT_BASE: ${QL_OAUTH_REDIRECT_BASE:-}
      QL_OAUTH_FEISHU_CLIENT_ID: ${QL_OAUTH_FEISHU_CLIENT_ID:-}
      QL_OAUTH_FEISHU_CLIENT_SECRET: ${QL_OAUTH_FEISHU_CLIENT_SECRET:-}
      QL_OAUTH_DINGTALK_CLIENT_ID: ${QL_OAUTH_DINGTALK_CLIENT_ID:-}
      QL_OAUTH_DINGTALK_CLIENT_SECRET: ${QL_OAUTH_DINGTALK_CLIENT_SECRET:-}
      QL_OAUTH_WECOM_CLIENT_ID: ${QL_OAUTH_WECOM_CLIENT_ID:-}
      QL_OAUTH_WECOM_CLIENT_SECRET: ${QL_OAUTH_WECOM_CLIENT_SECRET:-}
      QL_OAUTH_TENCENT_DOCS_CLIENT_ID: ${QL_OAUTH_TENCENT_DOCS_CLIENT_ID:-}
      QL_OAUTH_TENCENT_DOCS_CLIENT_SECRET: ${QL_OAUTH_TENCENT_DOCS_CLIENT_SECRET:-}
      QL_OAUTH_BAIDU_NETDISK_CLIENT_ID: ${QL_OAUTH_BAIDU_NETDISK_CLIENT_ID:-}
      QL_OAUTH_BAIDU_NETDISK_CLIENT_SECRET: ${QL_OAUTH_BAIDU_NETDISK_CLIENT_SECRET:-}
    volumes:
      - ./data:/data
      # docker_api 管理容器需要挂载 docker socket（可选；不需要可注释）
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
